# Allow these dependencies to run their install build scripts.
# pnpm 11 reads `allowBuilds` from pnpm-workspace.yaml (it replaced the
# `onlyBuiltDependencies` list, and no longer reads package.json's `pnpm` field).
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true

# Enforce package.json's `engines`. pnpm 11 ignores .npmrc's `engine-strict`
# for this, same migration as `allowBuilds` above.
engineStrict: true
